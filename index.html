<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yukt Labs – Promotion, tested until it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f5;
  --bg2:#eceeeb;
  --ink:#0f1210;
  --mut:#5d645f;
  --line:#dde1dd;
  --ac:#00927d;
  --ac2:#ff6b45;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f0e;
    --bg2:#151a18;
    --ink:#eef2ef;
    --mut:#98a29c;
    --line:#232a27;
    --ac:#2fd3b8;
    --ac2:#ff8a68;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f0e;
  --bg2:#151a18;
  --ink:#eef2ef;
  --mut:#98a29c;
  --line:#232a27;
  --ac:#2fd3b8;
  --ac2:#ff8a68;
  color-scheme:dark;
}
html{scroll-padding-top:90px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:hidden;transition:background .3s,color .3s}
h1,h2,h3,h4,.logo b,.big{font-family:"Space Grotesk",system-ui,sans-serif;letter-spacing:-.03em;line-height:1.05}
a{color:inherit;text-decoration:none}
button{font:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:999px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:88px 0}
h2{font-size:clamp(32px,4.8vw,54px);font-weight:700;max-width:18ch}
.lead{color:var(--mut);max-width:56ch;margin-top:16px}

/* Refreshed Tactile Pill Buttons */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:13px 26px;
  border-radius:999px;
  font-weight:600;
  font-size:15.5px;
  border:1.5px solid var(--ink);
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 94%,#fff),var(--bg2));
  color:var(--ink);
  box-shadow:0 2px 6px rgba(15,18,16,.06),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease,background .25s ease,border-color .25s ease;
  cursor:pointer;
}
.btn.p{
  background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 88%,var(--ac)),var(--ink));
  color:var(--bg);
  border-color:var(--ink);
  box-shadow:0 8px 20px -8px color-mix(in srgb,var(--ink) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.22);
}
.btn:hover{
  transform:translateY(-2.5px);
  box-shadow:0 12px 24px -10px color-mix(in srgb,var(--ac) 35%,rgba(0,0,0,.22));
  border-color:var(--ac);
}
.btn.p:hover{
  background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 82%,var(--ink)));
  border-color:var(--ac);
  color:#fff;
}
.btn:active{
  transform:translateY(0) scale(.97);
}

/* Top Scroll Progress Bar */
#bar{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--ac);transform-origin:0 50%;transform:scaleX(0);z-index:95}

/* Header & Navigation */
header{position:fixed;top:0;left:0;right:0;z-index:80;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 86%,transparent);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{display:flex;align-items:center;gap:11px}
.logo b{font-size:23px;font-weight:700}

/* Clockwise Borderless Y-to-Erlenmeyer Chemical Flask Morphing Logo */
.yukt-mark{
  width:40px;
  height:40px;
  overflow:visible;
  transform-origin:20px 20px;
  transition:transform .75s cubic-bezier(.22,1,.36,1);
}
.yukt-mark .y-left,.yukt-mark .y-right{
  transition:opacity .45s ease,transform .65s cubic-bezier(.22,1,.36,1);
  transform-origin:20px 20px;
}
.yukt-mark .flask-group{
  opacity:0;
  transform:rotate(-90deg) scale(.72);
  transform-origin:20px 20px;
  transition:opacity .45s ease,transform .65s cubic-bezier(.22,1,.36,1);
}
.yukt-mark .liquid-wave{
  transform-origin:20px 27px;
  transition:transform .6s ease;
}
.yukt-mark .dot-spark{
  transition:transform .65s cubic-bezier(.22,1,.36,1),fill .4s ease;
  transform-origin:20px 20px;
}
.yukt-mark .bub{opacity:0;transform:translateY(0)}

.logo:hover .yukt-mark,.yukt-mark.morph{
  transform:rotate(360deg);
}
.logo:hover .yukt-mark .y-left,.yukt-mark.morph .y-left{
  opacity:0;
  transform:rotate(90deg) scale(.65);
}
.logo:hover .yukt-mark .y-right,.yukt-mark.morph .y-right{
  opacity:0;
  transform:rotate(90deg) scale(.65);
}
.logo:hover .yukt-mark .flask-group,.yukt-mark.morph .flask-group{
  opacity:1;
  transform:rotate(0deg) scale(1);
}
.logo:hover .yukt-mark .dot-spark,.yukt-mark.morph .dot-spark{
  transform:translate(-9px,-22px) scale(.88);
  fill:var(--ac2);
}
.logo:hover .yukt-mark .bub-1,.yukt-mark.morph .bub-1{animation:bubbleUp 1.6s ease-in-out infinite}
.logo:hover .yukt-mark .bub-2,.yukt-mark.morph .bub-2{animation:bubbleUp 1.9s ease-in-out .45s infinite}
.logo:hover .yukt-mark .bub-3,.yukt-mark.morph .bub-3{animation:bubbleUp 1.5s ease-in-out .85s infinite}

@keyframes bubbleUp{
  0%{opacity:0;transform:translateY(2px) scale(.6)}
  35%{opacity:.95}
  100%{opacity:0;transform:translateY(-11px) scale(1.1)}
}

.links{display:flex;gap:4px;align-items:center}
.nv{position:relative;height:72px;display:flex;align-items:center}
.nv>a{padding:9px 14px;border-radius:999px;font-weight:500;font-size:15px;transition:background .2s}
.nv>a:hover,.nv>a.act{background:var(--bg2)}
.nv>a.sb:after{content:"▾";font-size:10px;margin-left:6px;opacity:.65}
.dd{position:absolute;top:100%;left:0;padding-top:6px;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .25s,transform .3s cubic-bezier(.2,.8,.2,1)}
.nv:hover .dd,.nv:focus-within .dd{opacity:1;transform:none;pointer-events:auto}
.ddi{width:300px;padding:10px;border-radius:20px;background:var(--bg);border:1px solid var(--line);box-shadow:0 22px 44px -20px rgba(10,30,25,.35)}
.ddi a{display:block;padding:10px 12px;border-radius:12px;transition:background .2s,transform .2s}
.ddi a:hover{background:var(--bg2);transform:translateX(4px)}
.ddi b{display:block;font:700 15px "Space Grotesk"}
.ddi span{font-size:13px;color:var(--mut);line-height:1.35;display:block}
.dd.i .ddi{width:240px;padding:14px 16px;font-size:14px;color:var(--mut)}
.nr{display:flex;gap:10px;align-items:center}
.nr .btn{padding:10px 20px;font-size:14.5px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:border-color .2s,transform .2s}
.ib:hover{border-color:var(--ac);transform:scale(1.06)}
.burger{display:none}
main{min-height:80vh}

/* Coming Soon Announcement Pill & Interactive Launch Banner */
.launch-pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;font-weight:600;margin-bottom:22px;position:relative;overflow:hidden}
.launch-pill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ac) 18%,transparent),transparent);transform:translateX(-100%);animation:shimmer 3.4s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.pulse-dot{width:9px;height:9px;border-radius:50%;background:var(--ac2);box-shadow:0 0 0 0 color-mix(in srgb,var(--ac2) 65%,transparent);animation:pulseRing 2s infinite}
@keyframes pulseRing{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac2) 65%,transparent)}
  70%{box-shadow:0 0 0 9px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.launch-banner{margin-top:46px;border-radius:26px;border:1px solid var(--line);background:linear-gradient(135deg,var(--bg2),color-mix(in srgb,var(--ac) 8%,var(--bg2)));padding:28px 30px;display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.cd-badge-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.flask-mini{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--ac) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--ac) 35%,var(--line))}
.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;max-width:410px}
.cd-box{
  background:var(--bg);
  border:1.5px solid var(--line);
  border-radius:16px;
  padding:12px 10px;
  text-align:center;
  cursor:pointer;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s,background .25s;
  user-select:none;
}
.cd-box:hover{
  transform:translateY(-4px);
  border-color:var(--ac);
  box-shadow:0 12px 22px -12px color-mix(in srgb,var(--ac) 45%,transparent);
}
.cd-box:active{transform:scale(.95)}
.cd-box.active{
  border-color:var(--ac2);
  background:color-mix(in srgb,var(--ac2) 9%,var(--bg));
  transform:translateY(-3px) scale(1.03);
}
.cd-box b{font:700 26px "Space Grotesk";display:block;color:var(--ac);transition:color .25s}
.cd-box.active b{color:var(--ac2)}
.cd-box span{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.cd-hint{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--bg);border:1px dashed var(--line);font-size:13.5px;color:var(--ink);display:flex;align-items:center;gap:8px}
.cd-hint i{font-style:normal;color:var(--ac2);font-weight:700}
.notify-row{display:flex;gap:10px;flex-wrap:wrap}
.notify-row input{flex:1;min-width:190px;padding:13px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;transition:border-color .2s}
.notify-row input:focus{outline:none;border-color:var(--ac)}
#notifyMsg{display:none;margin-top:10px;font-size:14px;font-weight:600;color:var(--ac)}

/* Hero */
.hero{padding:122px 0 36px;position:relative}
.hg{display:grid;grid-template-columns:1.32fr 1fr;gap:46px;align-items:end}
.hero h1{font-size:clamp(42px,7vw,96px);font-weight:700}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
.hero h1 .w i{display:inline-block;font-style:normal}
.hero p.lead{font-size:18.5px;margin:22px 0 28px}
.lab{border:1px solid var(--line);border-radius:24px;padding:24px;background:var(--bg2)}
.lab h4{font-size:19px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-size:14.5px;font-weight:500;cursor:pointer;transition:all .25s}
.chip:hover{border-color:var(--ac);transform:translateY(-1.5px)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.res{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);font-size:15px;display:grid;gap:8px;padding-left:0}
.res li{list-style:none}
.res li:before{content:"+";color:var(--ac);font-weight:700;margin-right:10px}

/* Marquee */
.mq{overflow:hidden;border-block:1px solid var(--line);padding:18px 0;margin-top:52px;white-space:nowrap}
.mq div{display:inline-flex;gap:48px;animation:mq 30s linear infinite;font:700 24px "Space Grotesk";color:var(--mut)}
.mq:hover div{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}

/* Client Logo Strip */
.logos-strip{padding:42px 0;border-bottom:1px solid var(--line)}
.logos-strip small{display:block;text-align:center;color:var(--mut);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:22px}
.logos-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px;align-items:center;text-align:center}
.brand-badge{padding:12px 14px;border-radius:999px;border:1px solid var(--line);font:700 15.5px "Space Grotesk";color:var(--mut);transition:color .25s,border-color .25s,transform .25s}
.brand-badge:hover{color:var(--ink);border-color:var(--ac);transform:translateY(-2px)}

/* Cards & Grids */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.card{position:relative;border-radius:24px;overflow:hidden;min-height:320px;grid-column:span 4;isolation:isolate;color:#fff;display:block}
.card.big{grid-column:span 8}
.art{position:absolute;inset:0;transition:transform .8s cubic-bezier(.2,.8,.2,1);z-index:-1}
.card:hover .art{transform:scale(1.07)}
.art i{position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
.card .in{position:absolute;inset:auto 0 0 0;padding:24px;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.card small{opacity:.88;font-size:14px}
.card h3{font-size:26px;margin-top:2px}
.card .more{max-height:0;opacity:0;overflow:hidden;font-size:14.5px;transition:max-height .45s,opacity .35s,margin .35s}
.card:hover .more,.card:focus-visible .more{max-height:90px;opacity:1;margin-top:8px}
.pill{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:#fff;color:#0f1210;display:grid;place-items:center;transition:transform .4s;font-weight:700}
.card:hover .pill{transform:rotate(45deg) scale(1.08)}

/* Services */
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.s{padding:28px;border-radius:22px;background:var(--bg2);transition:transform .35s,background .35s,color .35s;display:block;border:1px solid transparent}
.s:hover{transform:translateY(-6px);background:var(--ink);color:var(--bg)}
.s:hover p{color:inherit;opacity:.82}
.s svg{width:34px;height:34px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s h3{font-size:23px;margin:26px 0 8px}
.s p{color:var(--mut);font-size:15.5px}
.s em{font-style:normal;font-size:14px;font-weight:600;display:block;margin-top:14px;color:var(--ac)}

/* Workflow */
.flow{position:relative;margin-top:44px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.flow:before{content:"";position:absolute;top:21px;left:0;right:0;height:2px;background:var(--line)}
.st .d{width:44px;height:44px;border-radius:50%;background:var(--bg);border:2px solid var(--ac);display:grid;place-items:center;font:700 15px "Space Grotesk";position:relative;z-index:1}
.st h3{font-size:21px;margin:16px 0 6px}
.st p{font-size:15px;color:var(--mut)}
.st small{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ac)}

/* Audience Tabs */
.aud-box{margin-top:32px;border:1px solid var(--line);border-radius:24px;padding:30px;background:var(--bg);display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}

/* Testimonials & Blog Cards */
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:38px}
.q{border:1px solid var(--line);border-radius:22px;padding:26px;background:var(--bg)}
.q p{font:700 20px/1.35 "Space Grotesk";letter-spacing:-.02em}
.q span{display:block;margin-top:14px;color:var(--mut);font-size:14px}

.bcard{border:1px solid var(--line);border-radius:22px;padding:26px;background:var(--bg);display:flex;flex-direction:column;gap:12px;transition:transform .3s,border-color .3s}
.bcard:hover{transform:translateY(-5px);border-color:var(--ac)}
.bcard small{color:var(--ac);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.bcard h3{font-size:23px}
.bcard p{color:var(--mut);font-size:15px;flex:1}

/* Blog Search & Filter Bar */
.blog-tools{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.blog-search{padding:11px 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;min-width:240px}
.blog-search:focus{outline:none;border-color:var(--ac)}

/* CTA */
.cta{background:var(--ink);color:var(--bg);border-radius:28px;padding:64px 34px;text-align:center}
.cta h2{margin:0 auto}
.cta p{opacity:.76;margin:16px auto 26px;max-width:48ch}
.cta .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.cta .btn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}

/* Subpages */
.ph{padding:124px 0 20px}
.crumb{font-size:14.5px;color:var(--mut);margin-bottom:16px}
.crumb a{border-bottom:1px solid var(--line)}
.crumb a:hover{color:var(--ac)}
.ph h1{font-size:clamp(38px,6vw,78px);font-weight:700;max-width:17ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:start}
.hb{height:min(44vw,360px);border-radius:26px;position:relative;overflow:hidden;margin-top:30px}
.hb i{position:absolute;border-radius:50%;background:rgba(255,255,255,.22)}
ul.ck{list-style:none;padding:0;display:grid;gap:12px;margin-top:18px}
ul.ck li:before{content:"✓";color:var(--ac);font-weight:700;margin-right:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:28px 0}
.stats div,.nums div{background:var(--bg2);border-radius:18px;padding:22px}
.stats b,.nums b{font:700 clamp(28px,4.2vw,46px) "Space Grotesk";letter-spacing:-.03em;display:block}
.stats span,.nums span{font-size:14px;color:var(--mut)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:24px}
.pn{display:flex;justify-content:space-between;gap:16px;margin-top:54px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.pn a{font:700 20px "Space Grotesk";transition:color .2s}
.pn a:hover{color:var(--ac)}
.fl{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:24px;scrollbar-width:none}
.fl .chip{flex:none}

/* Pricing & FAQ */
.tg{display:inline-flex;margin-top:20px;border:1.5px solid var(--line);border-radius:999px;padding:4px;background:var(--bg2)}
.tg button{border:0;background:none;color:var(--ink);padding:9px 20px;border-radius:999px;font-weight:600;cursor:pointer;transition:all .3s}
.tg button.on{background:var(--ink);color:var(--bg)}
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:36px}
.pc{border:1px solid var(--line);border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:16px;transition:transform .35s,border-color .35s}
.pc:hover{transform:translateY(-6px);border-color:var(--ac)}
.pc.f{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pc.f .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.pc.f .btn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.pc h3{font-size:25px}
.pp{font:700 42px "Space Grotesk";letter-spacing:-.03em}
.pp small{font:500 14px "DM Sans";opacity:.65;letter-spacing:0}
.pc ul{flex:1}
.fq{border-bottom:1px solid var(--line)}
.fq>button{width:100%;display:flex;justify-content:space-between;gap:20px;align-items:center;background:none;border:0;color:var(--ink);font:700 19.5px "Space Grotesk";padding:20px 0;cursor:pointer;text-align:left}
.fq b{font-size:24px;transition:transform .35s;color:var(--ac)}
.fq.on b{transform:rotate(45deg)}
.fq div{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.8,.2,1);color:var(--mut)}
.fq div p{padding:0 0 20px;max-width:64ch}
.faq{max-width:820px;margin-top:30px}

/* Team & Contact */
.tm{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:36px}
.tc{border-radius:22px;background:var(--bg2);padding:22px;transition:transform .35s}
.tc:hover{transform:translateY(-5px)}
.av{width:100%;aspect-ratio:1.15;border-radius:16px;display:grid;place-items:center;font:700 52px "Space Grotesk";color:#fff;margin-bottom:16px}
.tc h3{font-size:22px}
.tc span{color:var(--ac);font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.tc p{color:var(--mut);font-size:14.5px}
.cf{display:grid;gap:14px}
.cf .r2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cf input,.cf textarea{width:100%;padding:15px 18px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg2);color:inherit;font:inherit}
.cf input:focus,.cf textarea:focus{outline:none;border-color:var(--ac)}
#ok{display:none;font-weight:600;color:var(--ac)}

/* Footer */
footer{background:var(--bg2);padding:56px 0 28px;margin-top:40px}
.fg{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:28px}
.fg h4{font-size:16px;margin-bottom:12px}
.fg a{display:block;color:var(--mut);font-size:15px;padding:3px 0}
.fg a:hover{color:var(--ac)}
.cp{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:14px}
#up{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;cursor:pointer;z-index:70;opacity:0;transform:translateY(20px);pointer-events:none;transition:all .35s}
#up.on{opacity:1;transform:none;pointer-events:auto}

/* Responsive Breakpoints */
@media(max-width:1100px){
  .nv>a{padding:9px 10px;font-size:14px}
  .card{grid-column:span 6}
  .card.big{grid-column:span 12}
  .hg,.launch-banner,.aud-box{grid-template-columns:1fr}
}
@media(max-width:900px){
  .links{position:fixed;inset:0;background:var(--bg);flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:0;transform:translateY(-100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);z-index:-1;padding:90px 26px 30px;overflow-y:auto}
  .links.open{transform:none}
  .nv{height:auto;flex-direction:column;align-items:flex-start;width:100%;padding:6px 0}
  .nv>a{font:700 28px "Space Grotesk";padding:4px 0}
  .nv>a.sb:after{display:none}
  .dd{position:static;opacity:1;transform:none;pointer-events:auto;padding:0}
  .dd.i{display:none}
  .ddi{width:100%;border:0;box-shadow:none;background:none;padding:2px 0 6px 4px}
  .ddi a{padding:4px 0}
  .ddi a:hover{transform:none;background:none}
  .ddi span{display:none}
  .nr .btn{display:none}
  .burger{display:grid}
  .card,.card.big{grid-column:span 12;min-height:280px}
  .card .more{max-height:90px;opacity:1;margin-top:8px}
  .flow{grid-template-columns:1fr}
  .flow:before{display:none}
  .two{grid-template-columns:1fr;gap:26px}
  .fg{grid-template-columns:1fr 1fr}
  section{padding:68px 0}
  .hero{padding-top:108px}
  .ph{padding-top:106px}
}
@media(max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  .cf .r2{grid-template-columns:1fr}
  .cta{padding:48px 20px}
  .fg{grid-template-columns:1fr}
  .pc{padding:24px}
  .mq div{font-size:20px}
  .btn{padding:12px 22px}
  .cd-grid{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

      '<section><div class="wrap"><div class="head"><h2>Latest from the lab.</h2><a class="btn" href="#blog">Read all insights ↗</a></div><div class="trio">'+POSTS.slice(0,3).map(function(p){return'<a class="bcard" href="#post-'+p.id+'"><small>'+p.cat+'</small><h3>'+p.t+'</h3><p>'+p.s+'</p><span style="font-weight:600;color:var(--ac)">Read note →</span></a>'}).join("")+'</div></div></section>' +
      '<section style="background:var(--bg2)"><div class="wrap"><h2>Clients, in their words.</h2><div class="trio">'+[["They turned our opening into a street-wide event.","Owner, Saffron & Co."],["Clear plans and honest reports. We always knew where our money went.","Marketing lead, Kora Skin"],["The creators felt real to our audience.","Founder, Nova Fit"]].map(function(x){return'<div class="q"><p>“'+x[0]+'”</p><span>'+x[1]+' (sample review)</span></div>'}).join("")+'</div></div></section>' +
      cta();

    works:function(){

        '<section style="padding-top:36px"><div class="wrap"><div class="fl">'+[["","All work"],["launch","Launches"],["influencer","Influencer"],["retail","Retail"],["brand","Branding"],["event","Events"]].map(function(f,i){return'<button class="chip'+(i?'':' on')+'" data-a="flt" data-v="'+f[0]+'">'+f[1]+'</button>'}).join("")+'</div><div class="grid" id="wg">'+W.map(card).join("")+'</div></div></section>' +
        cta();

    services:function(){
      return ph([["Services"]],"What we do.","Six services that work alone or together. Pick one, or let us build the mix.") +
        '<section style="padding-top:36px"><div class="wrap"><div class="sv">'+SV.map(svc).join("")+'</div></div></section>' +

    about:function(){
      return ph([["About","about"]],"Yukt means joined.","In Sanskrit, yukt means connected. That is the job: connecting brands with the people, creators and shops that matter to them.") +
        '<section style="padding-top:36px"><div class="wrap two"><div><h2>Why a lab?</h2><p class="lead">Most promotion is guesswork. We test small ideas first, measure them, and put the budget behind what works. Strategy, creative and ads sit in one team, so nothing gets lost between them.</p><p class="lead">We work with local retailers as happily as with national brands and independent creators.</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px"><a class="btn p" href="#team">Meet the team</a><a class="btn" href="#blog">Read lab notes</a></div></div><div class="nums">'+[["120+","Campaigns delivered"],["45","Creators in our network"],["3x","Average return"],["24h","Reply time"]].map(function(x){return'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("")+'</div></div></section>' +
        '<section style="background:var(--bg2)"><div class="wrap"><h2>What we believe.</h2><div class="trio">'+[["Test first","Small experiments before big budgets."],["Say it plainly","Clear plans, simple reports, no jargon."],["Stay joined","One team across strategy, creative and ads."]].map(function(x){return'<div class="q"><p>'+x[0]+'</p><span>'+x[1]+'</span></div>'}).join("")+'</div></div></section>' +
        cta();

    team:function(){
      return ph([["About","about"],["Team"]],"The people behind the work.","A tight-knit crew of strategists, filmmakers, media buyers, and creator managers.") +
        '<section style="padding-top:30px"><div class="wrap"><div class="tm">'+TM.map(function(m){return'<div class="tc"><div class="av" style="background:linear-gradient(135deg,'+m[2]+')">'+m[0][0]+'</div><h3>'+m[0]+'</h3><span>'+m[1]+'</span><p>'+m[3]+'</p></div>'}).join("")+'</div></div></section>' +
        cta("Want to join us?","See open roles in the lab.");
    },

    careers:function(){
      return ph([["About","about"],["Careers"]],"Join the lab.","Small team, real campaigns, fast learning. Open roles are samples; replace with yours.") +
        '<section style="padding-top:30px"><div class="wrap"><div class="faq">'+faq([
          ["Social media manager","Plan and run content calendars for retail and brand clients. 2+ years experience. Lucknow or remote."],
          ["Video editor","Cut reels and short films quickly with strong taste. Portfolio required."],
          ["Creator partnerships executive","Find, brief and manage creators for campaigns. Strong communication needed."]
        ])+'</div><a class="btn p" style="margin-top:28px" href="mailto:careers@yuktlabs.com">Apply by email</a></div></section>';
    },

    blog:function(){
      return ph([["About","about"],["Blog & Insights"]],"Notes from the lab.","Practical playbooks on retail promotion, creator marketing, and small-budget testing.") +
        '<section style="padding-top:30px"><div class="wrap"><div class="blog-tools"><div class="chips">'+["All","Retail","Influencer","Strategy","Analytics"].map(function(c,i){return'<button class="chip'+(i?'':' on')+'" data-a="bcat" data-v="'+c+'">'+c+'</button>'}).join("")+'</div><input type="search" class="blog-search" id="blogSearch" placeholder="Search playbooks..." aria-label="Search playbooks"></div><div class="trio" id="blogGrid">'+POSTS.map(function(p){return'<a class="bcard" data-cat="'+p.cat+'" href="#post-'+p.id+'"><small>'+p.cat+'</small><h3>'+p.t+'</h3><p>'+p.s+'</p><span style="font-weight:600;color:var(--ac)">Read article →</span></a>'}).join("")+'</div></div></section>' +
        cta();
    },

    pricing:function(){
      return ph([["Pricing"]],"Simple plans.","Monthly retainers. Ad spend and creator fees are paid by you directly. Sample prices; edit to suit.") +
        '<section style="padding-top:10px"><div class="wrap"><div class="tg" id="tg"><button class="on" data-a="bill" data-v="m">Monthly</button><button data-a="bill" data-v="y">Yearly · save 20%</button></div><div class="pr">'+[
          ["Starter",25,20,["Social media management","12 designed posts","Monthly report"],""],
          ["Growth",60,48,["Everything in Starter","4 reels and 1 shoot","Influencer campaign","Paid ads management"],"f"],
          ["Custom",0,0,["Multi-city retail promotion","Large creator campaigns","Dedicated team"],""]
        ].map(function(p){return'<div class="pc '+p[4]+'"><h3>'+p[0]+'</h3><div class="pp">'+(p[1]?'₹<span class="pv" data-m="'+p[1]+'" data-y="'+p[2]+'">'+p[1]+'</span>k<small> /month</small>':'Let’s talk')+'</div><ul class="ck">'+p[3].map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul><a class="btn" href="#contact">'+(p[1]?'Choose '+p[0]:'Get a quote')+'</a></div>'}).join("")+'</div></div></section>' +
        '<section><div class="wrap"><h2>Questions.</h2><div class="faq">'+faq([
          ["How soon can a campaign start?","Most go live within two weeks of the brief. Urgent festival offers can start in days."],
          ["Do you work with small shops?","Yes. Starter is built for local shops and retailers."],
          ["Who pays for ads and creators?","You pay them directly, so there is no markup."],
          ["Can I change or stop my plan?","Yes, with 30 days’ notice."]
        ])+'</div></div></section>';
    },

    contact:function(){
      return ph([["Contact"]],"Tell us your goal.","We reply within one working day.") +
        '<section style="padding-top:30px"><div class="wrap two"><form class="cf" id="cf"><div class="chips" id="cc">'+["Brand campaign","Influencers","Shop promotion","Paid ads","Video"].map(function(x){return'<button type="button" class="chip" data-a="chip">'+x+'</button>'}).join("")+'</div><div class="r2"><input id="fn" placeholder="Your name" required aria-label="Name"><input id="fe" type="email" placeholder="Email" required aria-label="Email"></div><textarea id="fm" rows="5" placeholder="What are you promoting, and by when?" aria-label="Message"></textarea><button class="btn p" type="submit">Send my brief</button><p id="ok">Your email app is opening with your brief.</p></form><div><h2 style="font-size:32px">Prefer to talk?</h2><ul class="ck"><li>hello@yuktlabs.com</li><li>Lucknow, Uttar Pradesh, India</li><li>Mon to Sat, 10am to 7pm</li></ul></div></div></section>';
    }
  };

  function svcPage(id){
    var i=SV.findIndex(function(s){return s.id===id}),s=SV[i];
    if(!s)return P.home();
    var rel=W.filter(function(w){return w.sv.indexOf(id)>-1});
    var n=SV[(i+1)%SV.length],p=SV[(i+SV.length-1)%SV.length];
    return ph([["Services","services"],[s.n]],s.n+".",s.s) +
      '<section style="padding-top:30px"><div class="wrap two"><div><h2 style="font-size:34px">What it is.</h2><p class="lead">'+s.l+'</p></div><div><h2 style="font-size:34px">What you get.</h2><ul class="ck">'+s.d.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul></div></div></section>' +
      (rel.length?'<section style="background:var(--bg2)"><div class="wrap"><h2>Where we used it.</h2><div class="grid" style="margin-top:32px">'+rel.map(function(w){var c=Object.assign({},w,{b:0});return card(c)}).join("")+'</div></div></section>':'') +
      '<div class="wrap"><div class="pn"><a href="#svc-'+p.id+'">← '+p.n+'</a><a href="#svc-'+n.id+'">'+n.n+' →</a></div></div>' +
      cta();
  }

  function workPage(id){
    var i=W.findIndex(function(w){return w.id===id}),w=W[i];
    if(!w)return P.home();
    var n=W[(i+1)%W.length],p=W[(i+W.length-1)%W.length];
    return ph([["Works","works"],[w.t]],w.t+".",w.d) +
      '<div class="wrap"><div class="hb" style="background:'+G[i]+'"><i style="width:340px;height:340px;right:-60px;top:-80px"></i><i style="width:140px;height:140px;left:8%;bottom:14%"></i></div></div>' +
      '<section style="padding-top:36px"><div class="wrap"><div class="stats">'+w.st.map(function(x){x=x.split("|");return'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join("")+'</div><div class="two"><div><h2 style="font-size:32px">The challenge.</h2><p class="lead">'+w.ch+'</p></div><div><h2 style="font-size:32px">What we ran.</h2><ul class="ck">'+w.do.map(function(x){return'<li>'+x+'</li>'}).join("")+'</ul><p style="margin-top:22px;color:var(--mut);font-size:15px">Services used: '+w.sv.map(function(s){var o=SV.find(function(q){return q.id===s});return o?'<a href="#svc-'+s+'" style="border-bottom:1px solid var(--ac);margin-right:10px">'+o.n+'</a>':''}).join("")+'</p></div></div><div class="pn"><a href="#work-'+p.id+'">← '+p.t+'</a><a href="#work-'+n.id+'">'+n.t+' →</a></div></div></section>' +
      cta();
  }

  function postPage(id){
    var i=POSTS.findIndex(function(x){return x.id===id}),post=POSTS[i];
    if(!post)return P.home();
    var n=POSTS[(i+1)%POSTS.length],p=POSTS[(i+POSTS.length-1)%POSTS.length];
    return ph([["Blog","blog"],[post.cat]],post.t,post.s) +
      '<section style="padding-top:24px"><div class="wrap"><div style="max-width:740px"><p style="font-size:19px;line-height:1.75">'+post.b+'</p><div class="pn"><a href="#post-'+p.id+'">← '+p.t+'</a><a href="#post-'+n.id+'">'+n.t+' →</a></div></div></div></section>' +
      cta();
  }

  var cur="";
  function route(){
    try{
      var h=(location.hash||"#home").slice(1),top=h.split("-")[0];
      app.innerHTML=h.indexOf("svc-")===0?svcPage(h.slice(4)):h.indexOf("work-")===0?workPage(h.slice(5)):h.indexOf("post-")===0?postPage(h.slice(5)):(P[h]||P.home)();
      var tp={work:"works",svc:"services",team:"about",careers:"about",blog:"about",post:"about"}[top]||h;
      document.querySelectorAll(".nv>a").forEach(function(a){
        a.classList.toggle("act",a.getAttribute("href")==="#"+tp);
      });
      L.classList.remove("open");
      document.body.style.overflow="";
      if(cur!==h)window.scrollTo(0,0);
      cur=h;
      document.title=(h==="home"?"Yukt Labs – Promotion, tested until it works":"Yukt Labs – "+h.replace(/-/g," "));
      tickLaunch();
      runMotion();
    }catch(err){
      console.error("Render error:",err);
    }
  }

  function runMotion(){
    if(!M||rm)return;
    try{
      var w=document.querySelectorAll("#h1 .w i");
      if(w.length)M.animate(w,{transform:["translateY(110%)","translateY(0)"]},{delay:M.stagger(.08),duration:.85,easing:[.2,.8,.2,1]});
      var phEls=document.querySelectorAll(".ph h1,.ph .lead,.crumb");
      if(phEls.length)M.animate(phEls,{opacity:[0,1],transform:["translateY(22px)","none"]},{delay:M.stagger(.07),duration:.65,easing:[.2,.8,.2,1]});
    }catch(e){}
  }

  window.addEventListener("hashchange",route);

  function filterBlog(){
    var activeBtn=document.querySelector("[data-a='bcat'].on");
    var cat=activeBtn?activeBtn.dataset.v:"All";
    var q=($("#blogSearch")?$("#blogSearch").value.toLowerCase().trim():"");
    document.querySelectorAll("#blogGrid .bcard").forEach(function(el){
      var matchCat=(cat==="All"||el.dataset.cat===cat);
      var matchText=(!q||el.textContent.toLowerCase().indexOf(q)>-1);
      el.style.display=(matchCat&&matchText)?"":"none";
    });
  }

  document.addEventListener("input",function(e){
    if(e.target&&e.target.id==="blogSearch")filterBlog();
  });

  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-a]");
    if(!b)return;
    var a=b.dataset.a;
    if(a==="fq"){
      var f=b.parentNode,p=f.children[1],o=f.classList.toggle("on");
      b.setAttribute("aria-expanded",o);
      p.style.maxHeight=o?p.scrollHeight+"px":0;
    }else if(a==="chip"){
      b.classList.toggle("on");
    }else if(a==="cd"){
      activeCdUnit=b.dataset.u||"days";
      document.querySelectorAll("#cdGrid .cd-box").forEach(function(box){
        box.classList.toggle("active",box===b);
      });
      var hint=$("#cdHint");
      if(hint){
        hint.innerHTML='<i>✦</i><span>'+CD_INFO[activeCdUnit]+'</span>';
        if(M&&!rm)try{M.animate(b,{transform:["scale(.93)","scale(1.04)","scale(1.03)"]},{duration:.35})}catch(err){}
      }
    }else if(a==="goal"){
      b.parentNode.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c===b)});
      var r=$("#gr");
      if(r){
        r.innerHTML=goal(b.dataset.v);
        if(M&&!rm)try{M.animate(r,{opacity:[0,1],transform:["translateY(8px)","none"]},{duration:.35})}catch(err){}
      }
    }else if(a==="aud"){
      b.parentNode.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c===b)});
      var ab=$("#audBox");
      if(ab){
        ab.innerHTML=audHTML(b.dataset.v);
        if(M&&!rm)try{M.animate(ab,{opacity:[0,1],transform:["translateY(8px)","none"]},{duration:.35})}catch(err){}
      }
    }else if(a==="flt"){
      b.parentNode.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c===b)});
      document.querySelectorAll("#wg .card").forEach(function(c){
        var s=!b.dataset.v||c.dataset.k===b.dataset.v;
        c.style.display=s?"":"none";
        if(s&&M&&!rm)try{M.animate(c,{opacity:[0,1],transform:["scale(.95)","none"]},{duration:.45})}catch(err){}
      });
    }else if(a==="bcat"){
      b.parentNode.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c===b)});
      filterBlog();
    }else if(a==="bill"){
      b.parentNode.querySelectorAll("button").forEach(function(c){c.classList.toggle("on",c===b)});
      document.querySelectorAll(".pv").forEach(function(p){
        p.textContent=b.dataset.v==="y"?p.dataset.y:p.dataset.m;
        if(M&&!rm)try{M.animate(p,{opacity:[0,1],transform:["translateY(-8px)","none"]},{duration:.35})}catch(err){}
      });
    }
  });

  document.addEventListener("submit",function(e){
    if(e.target.id==="notifyForm"){
      e.preventDefault();
      var inp=$("#notifyEmail"),msg=$("#notifyMsg");
      if(inp&&msg){
        msg.textContent="✓ Added "+inp.value+" to the Jan 1, 2027 launch list! Stay tuned.";
        msg.style.display="block";
        inp.value="";
      }
      return;
    }
    if(e.target.id!=="cf")return;
    e.preventDefault();
    var s=[].map.call(document.querySelectorAll("#cc .chip.on"),function(c){return c.textContent}).join(", ");
    var ok=$("#ok");
    if(ok)ok.style.display="block";
    location.href="mailto:hello@yuktlabs.com?subject="+encodeURIComponent("New brief from "+$("#fn").value)+"&body="+encodeURIComponent("Name: "+$("#fn").value+"\nEmail: "+$("#fe").value+"\nInterested in: "+(s||"-")+"\n\n"+$("#fm").value);
  });

  if($("#bg"))$("#bg").onclick=function(){
    var o=L.classList.toggle("open");
    document.body.style.overflow=o?"hidden":"";
  };
  if($("#th"))$("#th").onclick=function(){
    var r=document.documentElement;
    var d=r.dataset.theme?r.dataset.theme==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;
    r.dataset.theme=d?"light":"dark";
  };

  var up=$("#up");
  if(up)up.onclick=function(){window.scrollTo({top:0,behavior:"smooth"})};
  var bar=$("#bar");
  window.addEventListener("scroll",function(){
    if(up)up.classList.toggle("on",window.scrollY>650);
    var h=document.documentElement.scrollHeight-window.innerHeight;
    if(bar)bar.style.transform="scaleX("+(h>0?window.scrollY/h:0)+")";
  },{passive:true});

  /* Clockwise Y-to-Erlenmeyer Chemical Flask Logo Morph */
  var navMark=document.querySelector("#brandLogo .yukt-mark");
  if(navMark&&!rm){
    setTimeout(function(){
      navMark.classList.add("morph");
      setTimeout(function(){navMark.classList.remove("morph")},2600);
    },900);
    setInterval(function(){
      if(!document.querySelector("#brandLogo:hover")){
        navMark.classList.add("morph");
        setTimeout(function(){navMark.classList.remove("morph")},2600);
      }
    },5500);
  }

  /* Live Countdown Timer for Launching Date (Jan 1, 2027) */
  var targetLaunch=new Date("2027-01-01T00:00:00+05:30").getTime();
  function tickLaunch(){
    var dEl=$("#cdD");
    if(!dEl)return;
    var diff=Math.max(0,targetLaunch-Date.now());
    var d=Math.floor(diff/86400000);
    var h=Math.floor((diff%86400000)/3600000);
    var m=Math.floor((diff%3600000)/60000);
    var s=Math.floor((diff%60000)/1000);
    dEl.textContent=String(d).padStart(2,"0");
    if($("#cdH"))$("#cdH").textContent=String(h).padStart(2,"0");
    if($("#cdM"))$("#cdM").textContent=String(m).padStart(2,"0");
    if($("#cdS"))$("#cdS").textContent=String(s).padStart(2,"0");
  }
  setInterval(tickLaunch,1000);

  route();
})();
</script>
